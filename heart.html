<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Particle Heart</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0e; overflow: hidden; }
  canvas { display: block; cursor: pointer; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 26px;
    text-align: center; pointer-events: none;
    font: 15px/1.4 system-ui, "Thonburi", sans-serif;
    color: rgba(210, 240, 255, .85);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .35; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">แตะหน้าจอ ♪</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- ปรับแต่งได้ตรงนี้ ----------
const COUNT = 7000;        // จำนวนอนุภาคของหัวใจ
const SPARKS = 260;        // จำนวนประกายที่ลอยขึ้นจากฐาน
const SPIN = 0.5;          // ความเร็วหมุน (เรเดียน/วินาที)
const BASE_Y = -1.5;       // ตำแหน่งฐานแสง (หน่วยเดียวกับหัวใจ)
const COLORS = ['120,205,255', '165,160,255', '210,240,255']; // ฟ้า, ม่วง, ขาวฟ้า
const SONG = 'song.mp3';   // ไฟล์เพลง (วางไว้โฟลเดอร์เดียวกับหน้านี้)
// ----------------------------------------

// เพลง: เริ่มพร้อมหัวใจตอนแตะครั้งแรก (ดูตรง start ด้านล่าง)
const song = new Audio(SONG);
song.loop = true;

let W, H, S, cx, cy, dpr;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.width = innerWidth * dpr;
  H = cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px';
  cv.style.height = innerHeight + 'px';
  S = Math.min(W, H) * 0.27;
  cx = W / 2;
  cy = H * 0.42;
}
addEventListener('resize', resize);
resize();

// สมการหัวใจ 3 มิติ: ค่า < 0 คืออยู่ข้างในหัวใจ (x=กว้าง, y=ลึก, z=สูง)
function heart(x, y, z) {
  const a = x * x + 2.25 * y * y + z * z - 1;
  return a * a * a - x * x * z * z * z - 0.1125 * y * y * z * z * z;
}

// หาระยะจากจุดศูนย์กลางถึงผิวหัวใจในทิศทางที่กำหนด
function surfaceRadius(ux, uy, uz) {
  let lo = 0, hi = 2;
  for (let i = 0; i < 20; i++) {
    const m = (lo + hi) / 2;
    if (heart(ux * m, uy * m, uz * m) < 0) lo = m; else hi = m;
  }
  return lo;
}

// ภาพจุดเรืองแสงที่วาดเตรียมไว้ล่วงหน้า (เร็วกว่าวาด gradient ทุกเฟรม)
const sprites = COLORS.map(rgb => {
  const s = document.createElement('canvas');
  s.width = s.height = 32;
  const g = s.getContext('2d');
  const grad = g.createRadialGradient(16, 16, 0, 16, 16, 16);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.22, `rgba(${rgb},0.9)`);
  grad.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = grad;
  g.fillRect(0, 0, 32, 32);
  return s;
});

const particles = [];
while (particles.length < COUNT) {
  let x = (Math.random() * 2 - 1) * 1.4;
  let y = (Math.random() * 2 - 1) * 0.8;
  let z = Math.random() * 2.5 - 1.15;
  if (heart(x, y, z) > 0) continue;

  // ส่วนใหญ่ดันไปอยู่ที่ผิว ให้เห็นรูปทรงชัด ที่เหลืออยู่ข้างในให้ดูมีมิติ
  if (Math.random() < 0.65) {
    const len = Math.hypot(x, y, z) || 1;
    const r = surfaceRadius(x / len, y / len, z / len) * (0.95 + Math.random() * 0.07);
    x = x / len * r; y = y / len * r; z = z / len * r;
  }

  const a = Math.random() * Math.PI * 2;
  const r0 = Math.sqrt(Math.random()) * 0.7;
  particles.push({
    tx: x, ty: z, tz: y,                               // เป้าหมาย (ty = แนวตั้ง)
    sx: Math.cos(a) * r0, sy: BASE_Y, sz: Math.sin(a) * r0, // จุดเริ่มที่ฐาน
    delay: (z + 1.15) / 2.5 * 2.4 + Math.random() * 1.3,
    size: 0.6 + Math.pow(Math.random(), 3) * 2.6,
    phase: Math.random() * Math.PI * 2,
    sprite: sprites[Math.random() < 0.55 ? 0 : Math.random() < 0.7 ? 1 : 2],
  });
}

const sparks = Array.from({ length: SPARKS }, () => ({
  ang: Math.random() * Math.PI * 2,
  r: 0.15 + Math.random() * 0.6,
  speed: 0.12 + Math.random() * 0.25,
  phase: Math.random(),
  size: 0.5 + Math.random() * 1.4,
  sprite: sprites[Math.random() < 0.6 ? 0 : 2],
}));

function dot(x, y, z, size, alpha, sprite) {
  const k = 4 / (4 - z);                 // perspective
  const r = size * k * dpr * 2.2;
  ctx.globalAlpha = Math.min(1, alpha * (0.45 + 0.55 * (z + 1.4) / 2.8));
  ctx.drawImage(sprite, cx + x * S * k - r, cy - y * S * k - r, r * 2, r * 2);
}

function drawBase(t) {
  const by = cy - BASE_Y * S;
  const rx = S * 0.8;
  ctx.save();
  ctx.translate(cx, by);
  ctx.scale(1, 0.24);

  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx * 1.5);
  g.addColorStop(0, 'rgba(200,250,255,0.95)');
  g.addColorStop(0.35, 'rgba(90,210,255,0.55)');
  g.addColorStop(1, 'rgba(40,150,255,0)');
  ctx.globalAlpha = 0.85 + 0.15 * Math.sin(t * 3);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, rx * 1.5, 0, Math.PI * 2);
  ctx.fill();

  // เส้นแสงหมุนวนรอบฐาน
  ctx.lineCap = 'round';
  ctx.shadowColor = 'rgba(120,220,255,1)';
  ctx.shadowBlur = 18 * dpr;
  for (let i = 0; i < 7; i++) {
    const start = t * (1.2 + i * 0.35) * (i % 2 ? -1 : 1) + i * 1.7;
    ctx.globalAlpha = 0.5 + 0.3 * Math.sin(t * 2 + i);
    ctx.strokeStyle = 'rgba(215,250,255,1)';
    ctx.lineWidth = (1.5 + (i % 3)) * dpr * 2;
    ctx.beginPath();
    ctx.arc(0, 0, rx * (0.55 + i * 0.09), start, start + 0.9 + (i % 3) * 0.5);
    ctx.stroke();
  }
  ctx.restore();
}

// ยังไม่แตะ = จอมืด ไม่มีเสียง พอแตะครั้งแรก หัวใจกับเพลงเริ่มพร้อมกัน
let t0 = 0, started = false;
function start() {
  t0 = performance.now();
  song.currentTime = 0;
  song.play().catch(() => {});
  if (started) return;   // แตะครั้งต่อไป = เล่นใหม่ตั้งแต่ต้นทั้งหัวใจและเพลง
  started = true;
  document.getElementById('hint').remove();
  requestAnimationFrame(frame);
}
addEventListener('pointerdown', start);
addEventListener('keydown', start);

function frame(now) {
  const t = (now - t0) / 1000;

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#0b0b0e';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';

  drawBase(t);

  const rot = t * SPIN;
  const beat = 1 + 0.05 * Math.pow(Math.max(0, Math.sin(t * 3)), 6) * Math.min(1, t / 5);

  for (const p of particles) {
    const prog = (t - p.delay) / 1.8;
    if (prog <= 0) continue;
    const e = prog >= 1 ? 1 : 1 - Math.pow(1 - prog, 3);

    // ลอยจากฐานขึ้นไปหาเป้าหมาย พร้อมหมุนเป็นเกลียว
    let x = p.sx + (p.tx * beat - p.sx) * e;
    let y = p.sy + (p.ty * beat - p.sy) * e;
    let z = p.sz + (p.tz * beat - p.sz) * e;
    x += Math.sin(t * 1.3 + p.phase) * 0.012;
    y += Math.cos(t * 1.1 + p.phase) * 0.012;

    const a = rot + (1 - e) * 5;
    const c = Math.cos(a), s = Math.sin(a);
    const twinkle = 0.55 + 0.45 * Math.sin(t * 4 + p.phase * 3);
    dot(x * c + z * s, y, z * c - x * s, p.size, twinkle * Math.min(1, prog * 3), p.sprite);
  }

  for (const sp of sparks) {
    const u = (t * sp.speed + sp.phase) % 1;
    const a = sp.ang + u * 6 + t * 0.8;
    const r = sp.r * (1 - u * 0.6);
    dot(Math.cos(a) * r, BASE_Y + u * 1.2, Math.sin(a) * r, sp.size, (1 - u) * 0.9, sp.sprite);
  }

  requestAnimationFrame(frame);
}
</script>
</body>
</html>
